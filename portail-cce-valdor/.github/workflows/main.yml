name: Deploy to Firebase Hosting & Functions
on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # Setup Python for Whisper functions
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install ffmpeg for pydub audio processing
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Frontend Build
      - name: Install Frontend Dependencies
        run: npm install

      - name: Debug Secrets Availability
        run: |
          echo "Checking if secrets are available..."
          if [ -z "${{ secrets.VITE_TYPESENSE_HOST }}" ]; then
            echo "::error::VITE_TYPESENSE_HOST is NOT available (Empty)"
          else
            echo "VITE_TYPESENSE_HOST is available"
          fi
          
          if [ -z "${{ secrets.VITE_TYPESENSE_API_KEY }}" ]; then
            echo "::error::VITE_TYPESENSE_API_KEY is NOT available (Empty)"
          else
            echo "VITE_TYPESENSE_API_KEY is available"
          fi


      - name: Build Frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_AI_API: ${{ secrets.VITE_GOOGLE_AI_API }}
          VITE_TYPESENSE_HOST: ${{ secrets.VITE_TYPESENSE_HOST }}
          VITE_TYPESENSE_API_KEY: ${{ secrets.VITE_TYPESENSE_API_KEY }}
          VITE_TYPESENSE_ADMIN_KEY: ${{ secrets.VITE_TYPESENSE_ADMIN_KEY }}

      # Sync Secrets to Firebase (Google Cloud Secret Manager)
      - name: Sync Secrets to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMITE_CCE }}
          TYPESENSE_ADMIN_KEY: ${{ secrets.VITE_TYPESENSE_ADMIN_KEY }}
          TYPESENSE_HOST: ${{ secrets.VITE_TYPESENSE_HOST }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          echo "$GCP_SA_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install -g firebase-tools
          
          if [ -n "$TYPESENSE_ADMIN_KEY" ]; then
             echo "Syncing TYPESENSE_ADMIN_KEY..."
             echo "$TYPESENSE_ADMIN_KEY" | npx firebase-tools functions:secrets:set TYPESENSE_ADMIN_KEY --project "$PROJECT_ID" --force
          fi
          
          if [ -n "$TYPESENSE_HOST" ]; then
             echo "Syncing TYPESENSE_HOST..."
             echo "$TYPESENSE_HOST" | npx firebase-tools functions:secrets:set TYPESENSE_HOST --project "$PROJECT_ID" --force
          fi

      # Backend (TypeScript Functions) Build
      - name: Install Functions Dependencies
        run: cd functions && npm install

      - name: Build Functions
        run: cd functions && npm run build

      # Backend (Python Functions) Setup - Firebase requires a venv
      - name: Setup Python Virtual Environment
        run: |
          cd functions-python
          python3.11 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      # Deploy
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions,hosting,firestore:rules,storage
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMITE_CCE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
