name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: portail-cce-valdor/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install dependencies
      working-directory: portail-cce-valdor
      # --legacy-peer-deps required due to react-quill expecting React 18
      # while project uses React 19. This is safe as react-quill works with React 19.
      # TODO: Remove flag when react-quill releases React 19 compatible version
      run: npm ci --legacy-peer-deps

    - name: Build
      working-directory: portail-cce-valdor
      run: npm run build
      env:
        # Map GitHub Secrets to Vite Environment Variables
        VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        VITE_GOOGLE_AI_API: ${{ secrets.GOOGLE_AI_API }}
        VITE_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Install Functions dependencies
      working-directory: portail-cce-valdor/functions
      run: npm install

    - name: Build Functions
      working-directory: portail-cce-valdor/functions
      run: npm run build

    - name: Create Functions .env
      working-directory: portail-cce-valdor/functions
      run: echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_AI_API }}" > .env

    - name: Setup Python Functions venv
      working-directory: portail-cce-valdor/functions-python
      run: |
        python3.11 -m venv venv
        ./venv/bin/pip install --upgrade pip
        ./venv/bin/pip install -r requirements.txt

    - name: Deploy to Firebase (Hosting & Functions)
      if: github.ref == 'refs/heads/main'
      uses: w9jds/firebase-action@master
      with:
        args: deploy --only functions,hosting --force
      env:
        GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMITE_CCE }}
        PROJECT_ID: comite-cce
        # We need to be in the project root (subdir) for firebase.json
        PROJECT_PATH: portail-cce-valdor
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
